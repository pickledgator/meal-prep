# Fly.io config — single always-on machine serving the Hono API + built SPA.
# Unlike trip-planning there is no in-memory SSE here, so one machine is a cost
# choice, not a correctness requirement; auto_stop_machines = "stop" is a safe
# tweak later if idle cost matters more than cold starts.
app = "meal-prep-nic" # "meal-prep" was taken globally
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
